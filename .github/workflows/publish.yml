name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGES: |
        proto:@contagxt/axa-proto
        core:@contagxt/axa-core
        cli:@contagxt/axa-cli
        refer:@contagxt/refer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      - name: Pack workspaces
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          while IFS=: read -r _ pkg; do
            [ -n "$pkg" ] || continue
            pnpm --filter "$pkg" pack --pack-destination "$RUNNER_TEMP/packs"
          done <<< "$PACKAGES"

      - name: Publish with OIDC
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          while IFS=: read -r dir pkg; do
            [ -n "$pkg" ] || continue
            version=$(node -p "require('./packages/$dir/package.json').version")
            name=${pkg#@}
            name=${name//\//-}
            npm publish "$RUNNER_TEMP/packs/$name-$version.tgz" \
              --access public --provenance --tag "$NPM_TAG"
          done <<< "$PACKAGES"
