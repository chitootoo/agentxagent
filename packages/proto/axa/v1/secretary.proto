syntax = "proto3";

package axa.v1;

// SecretaryRole is the only pair of speakers in the Boss-facing chat.
enum SecretaryRole {
  SECRETARY_ROLE_UNSPECIFIED = 0;
  SECRETARY_ROLE_BOSS = 1;
  SECRETARY_ROLE_SECRETARY = 2;
}

enum SecretaryMessageStatus {
  SECRETARY_MESSAGE_STATUS_UNSPECIFIED = 0;
  SECRETARY_MESSAGE_STATUS_DONE = 1;
  SECRETARY_MESSAGE_STATUS_PENDING = 2;
  SECRETARY_MESSAGE_STATUS_ERROR = 3;
}

message SecretaryMessage {
  string id = 1;
  SecretaryRole role = 2;
  string body = 3;
  string created_at = 4;
  SecretaryMessageStatus status = 5;
  string task_id = 6;
  // Project that owns task_id, used for console deep links.
  string project_id = 7;
}

message SecretarySettings {
  string base_url = 1;
  string model = 2;
  bool has_api_key = 3;
  string updated_at = 4;
}

message SecretaryState {
  repeated SecretaryMessage messages = 1;
  bool busy = 2;
}

message GetSecretaryStateRequest {}

message GetSecretaryStateResponse {
  SecretaryState state = 1;
  SecretarySettings settings = 2;
}

message SendBossMessageRequest {
  string message = 1;
}

message SendBossMessageResponse {
  SecretaryMessage message = 1;
}

message UpdateSecretarySettingsRequest {
  string base_url = 1;
  string model = 2;
  string api_key = 3;
  bool clear_api_key = 4;
}

message UpdateSecretarySettingsResponse {
  SecretarySettings settings = 1;
}

message ClearSecretaryChatRequest {}

message ClearSecretaryChatResponse {}

service SecretaryService {
  rpc GetSecretaryState(GetSecretaryStateRequest) returns (GetSecretaryStateResponse);
  rpc SendBossMessage(SendBossMessageRequest) returns (SendBossMessageResponse);
  rpc UpdateSecretarySettings(UpdateSecretarySettingsRequest) returns (UpdateSecretarySettingsResponse);
  rpc ClearSecretaryChat(ClearSecretaryChatRequest) returns (ClearSecretaryChatResponse);
}
